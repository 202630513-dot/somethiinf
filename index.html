<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점프점프 장애물 피하기 🏃</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }

        /* 게임 화면 */
        #game-board {
            width: 600px;
            height: 250px;
            background-color: #fff;
            border-bottom: 4px solid #555;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 플레이어 (공룡) */
        #player {
            position: absolute;
            bottom: 0px;
            left: 50px;
            font-size: 40px;
            line-height: 40px;
            z-index: 10;
        }

        /* 점프 애니메이션 클래스 */
        .jump {
            animation: jumpAnimation 0.5s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        @keyframes jumpAnimation {
            0% { bottom: 0px; }
            50% { bottom: 120px; } /* 점프 높이 */
            100% { bottom: 0px; }
        }

        /* 장애물 (선인장) */
        .obstacle {
            position: absolute;
            bottom: 0px;
            right: -30px;
            font-size: 30px;
            line-height: 30px;
        }

        /* 게임 오버 문구 */
        #game-over-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            color: #e53935;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .instructions {
            margin-top: 15px;
            color: #666;
            font-weight: bold;
        }

        .btn-start {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-start:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>

    <h1>🏃 장애물 피하기 게임</h1>
    
    <div class="score-board">
        점수: <span id="score">0</span> | 최고 점수: <span id="high-score">0</span>
    </div>

    <div id="game-board">
        <div id="player">🦖</div>
        <div id="game-over-text">GAME OVER</div>
    </div>

    <p class="instructions">💡 [스페이스바] 누르기 또는 [화면 클릭]으로 점프하세요!</p>
    <button class="btn-start" onclick="startGame()">게임 시작 / 다시하기</button>

    <script>
        const player = document.getElementById('player');
        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score');
        const gameOverText = document.getElementById('game-over-text');

        let isJumping = false;
        let isGameOver = true;
        let score = 0;
        let highScore = 0;
        let gameInterval;
        let obstacleTimeout;
        let obstacles = [];

        // 점프 동작
        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            player.classList.add('jump');

            setTimeout(() => {
                player.classList.remove('jump');
                isJumping = false;
            }, 500); // 점프 애니메이션 시간과 동일하게 설정
        }

        // 입력 이벤트 (스페이스바 및 클릭)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 스페이스바 페이지 스크롤 방지
                jump();
            }
        });

        gameBoard.addEventListener('click', jump);

        // 장애물 생성
        function createObstacle() {
            if (isGameOver) return;

            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.innerText = '🌵';
            obstacle.style.right = '-30px';
            gameBoard.appendChild(obstacle);

            obstacles.push({
                element: obstacle,
                x: 600 // 초기 x 위치
            });

            // 랜덤한 시간 뒤 다음 장애물 생성 (1초 ~ 2.5초 사이)
            const randomTime = Math.floor(Math.random() * 1500) + 1000;
            obstacleTimeout = setTimeout(createObstacle, randomTime);
        }

        // 게임 루프 (이동 및 충돌 검사)
        function updateGame() {
            if (isGameOver) return;

            // 점수 증가
            score++;
            scoreDisplay.textContent = Math.floor(score / 5);

            // 장애물 이동
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= 6; // 장애물 속도
                obs.element.style.right = (600 - obs.x) + 'px';

                // 충돌 검사
                // 플레이어 위치
                const playerBottom = parseInt(window.getComputedStyle(player).getPropertyValue('bottom'));
                
                // 플레이어와 장애물이 X축상에서 겹치고 Y축(높이)이 낮을 때 충돌
                if (obs.x > 50 && obs.x < 85 && playerBottom < 30) {
                    endGame();
                    return;
                }

                // 화면 밖으로 나간 장애물 제거
                if (obs.x < -30) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(updateGame);
        }

        // 게임 시작
        function startGame() {
            // 기존 상태 초기화
            isGameOver = false;
            score = 0;
            scoreDisplay.textContent = '0';
            gameOverText.style.display = 'none';

            // 기존 장애물 제거
            obstacles.forEach(obs => obs.element.remove());
            obstacles = [];
            clearTimeout(obstacleTimeout);

            // 루프 시작
            createObstacle();
            requestAnimationFrame(updateGame);
        }

        // 게임 오버
        function endGame() {
            isGameOver = true;
            gameOverText.style.display = 'block';

            const currentScore = Math.floor(score / 5);
            if (currentScore > highScore) {
                highScore = currentScore;
                highScoreDisplay.textContent = highScore;
            }
        }
    </script>
</body>
</html>
