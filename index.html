<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물고기 밥주기 게임 🐟</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            color: #006064;
            margin-bottom: 10px;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00838f;
            margin-bottom: 15px;
        }

        /* 어항 영역 */
        #aquarium {
            width: 700px;
            height: 450px;
            background: linear-gradient(to bottom, #81d4fa, #0288d1);
            border: 8px solid #b2ebf2;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* 물고기 */
        #fish {
            position: absolute;
            font-size: 40px; /* 초기 물고기 크기 */
            transition: left 0.8s ease-out, top 0.8s ease-out, transform 0.3s ease, font-size 0.3s ease;
            transform-origin: center center;
            pointer-events: none; /* 클릭 이벤트가 어항으로 통과하도록 설정 */
            z-index: 10;
        }

        /* 물고기 방향 */
        .left {
            transform: scaleX(1);
        }
        .right {
            transform: scaleX(-1);
        }

        /* 먹이 */
        .food {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffb74d;
            border-radius: 50%;
            border: 1px solid #f57c00;
            z-index: 5;
        }

        /* 안내 문구 및 버튼 */
        .instructions {
            margin-top: 15px;
            color: #006064;
            font-weight: bold;
        }

        .btn-reset {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 1rem;
            background-color: #00838f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: #006064;
        }
    </style>
</head>
<body>

    <h1>🐟 물고기 밥주기 게임</h1>
    
    <div class="stats-container">
        <div>먹은 밥: <span id="score">0</span>개</div>
        <div>물고기 크기: Level <span id="level">1</span></div>
    </div>

    <!-- 어항 (클릭 시 밥이 떨어짐) -->
    <div id="aquarium">
        <div id="fish" class="left">🐟</div>
    </div>

    <p class="instructions">💡 어항 안을 클릭해서 물고기에게 밥을 주세요!</p>
    <button class="btn-reset" onclick="resetGame()">다시 시작하기</button>

    <script>
        const aquarium = document.getElementById('aquarium');
        const fish = document.getElementById('fish');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');

        let score = 0;
        let level = 1;
        let fishSize = 40; // 초기 크기(px)
        
        // 물고기 현재 위치 (어항 중앙 근처)
        let fishX = 300;
        let fishY = 200;
        
        let foods = []; // 생성된 먹이 리스트
        let isEating = false; // 먹이를 향해 이동 중인지 여부

        // 초기 물고기 위치 설정
        fish.style.left = fishX + 'px';
        fish.style.top = fishY + 'px';

        // 어항 클릭 이벤트 (밥 투척)
        aquarium.addEventListener('click', (e) => {
            const rect = aquarium.getBoundingClientRect();
            const x = e.clientX - rect.left - 6; // 먹이 중앙 맞추기
            const y = e.clientY - rect.top - 6;

            createFood(x, y);
        });

        // 먹이 생성 함수
        function createFood(x, y) {
            const food = document.createElement('div');
            food.classList.add('food');
            food.style.left = x + 'px';
            food.style.top = y + 'px';
            
            aquarium.appendChild(food);
            
            // 먹이 객체 저장 (위치 및 가라앉는 속도)
            foods.push({
                element: food,
                x: x,
                y: y
            });
        }

        // 게임 루프 (먹이 가라앉기 & 물고기 이동/먹기)
        function gameLoop() {
            // 1. 먹이 떨어뜨리기
            const bottomLimit = aquarium.clientHeight - 15;
            for (let i = 0; i < foods.length; i++) {
                if (foods[i].y < bottomLimit) {
                    foods[i].y += 1; // 떨어지는 속도
                    foods[i].element.style.top = foods[i].y + 'px';
                }
            }

            // 2. 물고기가 가장 가까운 먹이 찾아서 이동하기
            if (foods.length > 0) {
                let targetFood = foods[0]; // 가장 먼저 떨어진 먹이 추적

                // 물고기 방향 전환 (좌/우)
                if (targetFood.x < fishX) {
                    fish.className = 'left';
                } else {
                    fish.className = 'right';
                }

                // 물고기를 먹이 위치로 이동
                fishX = targetFood.x - fishSize / 2;
                fishY = targetFood.y - fishSize / 2;
                
                fish.style.left = fishX + 'px';
                fish.style.top = fishY + 'px';

                // 먹이와 충돌 검사 (먹었는지 확인)
                const dist = Math.hypot((fishX + fishSize/2) - targetFood.x, (fishY + fishSize/2) - targetFood.y);
                if (dist < fishSize / 2) {
                    // 먹이 제거
                    targetFood.element.remove();
                    foods.shift(); // 첫 번째 먹이 제거

                    // 점수 및 크기 증가
                    score++;
                    scoreDisplay.textContent = score;

                    if (score % 5 === 0) { // 밥 5개마다 레벨업 & 크기 증가
                        level++;
                        fishSize += 8;
                        levelDisplay.textContent = level;
                        fish.style.fontSize = fishSize + 'px';
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // 게임 리셋
        function resetGame() {
            score = 0;
            level = 1;
            fishSize = 40;
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            fish.style.fontSize = fishSize + 'px';

            // 모든 먹이 삭제
            foods.forEach(f => f.element.remove());
            foods = [];

            // 물고기 위치 초기화
            fishX = 300;
            fishY = 200;
            fish.style.left = fishX + 'px';
            fish.style.top = fishY + 'px';
        }

        // 게임 시작
        gameLoop();
    </script>
</body>
</html>
